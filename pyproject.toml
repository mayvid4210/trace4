[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-f1"
version = "0.1.0"
description = "F1 tyre-state and race-strategy engine"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
